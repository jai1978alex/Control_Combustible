<!doctype html> 
<html lang="es"> 
    <head> 
        <meta charset="utf-8"> 
        <meta name="viewport" content="width=device-width,initial-scale=1"> 
        <title>Restablecer contraseña</title> 
        <link rel="stylesheet" href="../../css/programa/recuperar.css"> 
    </head> 

<!-- TÍTULO: CONTENIDO VISIBLE DE LA PÁGINA -->

    <!-- Comienza la parte visible de la página y aplica el diseño principal --> 
    <body class="acceso-page"> 
        <!-- Contiene y centra todo el contenido -->
        <div class="acceso-container"> 
            <!-- Crea el cuadro principal donde estará el formulario -->
            <div class="acceso-card"> 

                
<!-- TÍTULO: ENCABEZADO Y LOGO -->
                
                <!-- Contiene el logo y el título --> 
                <div class="acceso-header"> 
                    <!-- Espacio donde se muestra el logo -->
                    <div class="logo-box"> 
                        <!-- Muestra el nombre EMEX --> 
                        <span class="logo-texto">EMEX</span> 
                    </div> 
                    <!-- Muestra el título de la página -->
                    <h1 class="acceso-titulo">Nueva contraseña</h1> 
                </div> 
                
<!-- TÍTULO: FORMULARIO PARA CAMBIAR LA CONTRASEÑA    -->
                
                <!-- Inicia el formulario para cambiar la contraseña -->
                <form id="resetForm" class="acceso-form"> 
                    <!-- Agrupa el primer campo del formulario -->
                    <div class="form-group"> 
                        <!-- Indica que aquí se debe escribir la nueva contraseña -->
                        <label class="form-label">Nueva contraseña</label> 
                        <!-- Campo para escribir la nueva contraseña, con mínimo 12 caracteres -->
                        <input id="password" type="password" class="form-input" minlength="12" required> 
                    </div> 
                    <!-- Agrupa el segundo campo del formulario --> 
                    <div class="form-group"> 
                        <!-- Indica que se debe volver a escribir la contraseña -->
                        <label class="form-label">Repetir contraseña</label> 
                        <!-- Campo para repetir la contraseña, con mínimo 12 caracteres --> 
                        <input id="password2" type="password" class="form-input" minlength="12" required> 
                    </div> 
                    <!-- Botón que permite enviar el formulario y cambiar la contraseña -->
                    <button class="btn-acceso" type="submit">Cambiar contraseña</button> 
                    <!-- Espacio donde se mostrarán mensajes al usuario -->
                    <div id="mensaje"></div> 
                </form> 
            </div> 
        </div> 

        <!-- Conecta el formulario con el archivo JavaScript que controla el cambio de contraseña -->
        <script src="../../js/programa/restablecer.js"></script> 

    </body> 

</html>
